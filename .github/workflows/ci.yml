name: CI

on:
  pull_request:
  workflow_call: # reused by deploy.yml so master deploys only after the same checks pass

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      # E2E runs against local `wrangler dev` (started by playwright.config.ts) on a freshly seeded local D1.
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
