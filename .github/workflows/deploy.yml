name: Deploy

on:
  push:
    branches: [master]

# One deploy at a time; a newer push waits instead of cancelling a half-applied migration.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm run db:migrate:remote
      - run: npx wrangler deploy
      # Smoke test runs only once the repo variable APP_URL is set (Settings > Variables).
      - run: npm run smoke
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
