name = "dealership-app"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "dealership-db"
database_id = "a555ff32-b9e5-42d6-95da-fe96c52c91a6"
migrations_dir = "migrations"

[vars]
SESSION_TTL_HOURS = "8"

[dev]
port = 3000
